[package]
name = "feed-rtds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Polymarket RTDS WebSocket client (Chainlink + Binance topics)"

[lints]
workspace = true

[dependencies]
core-types = { path = "../core-types" }
feed-util = { path = "../feed-util" }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
feed-util = { path = "../feed-util", features = ["fake"] }
# test-util enables start_paused deterministic-time driver tests.
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "test-util"] }
