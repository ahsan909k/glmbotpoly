[package]
name = "bot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Orchestrator binary: wires all subsystems, supervision, control plane, CLI"

[lints]
workspace = true

[features]
# Deterministic, paper-only §11 chaos suite. Feature-gates `tests/chaos.rs` so
# the heavy fault-injection suite never burdens the default check/test loop
# (CLAUDE.md §3 — feature-gate heavy optional parts). Adds no code and no
# dependencies to production builds; run it with `just chaos`.
chaos = []
# The `bot replay` / `bot sweep` subcommands (deterministic backtest + parameter
# sweep over a recorded journal). Pulls `analytics`' heavy replay path (engine +
# paper venue + a tokio test-time runtime); off by default so the core bot builds
# lean (CLAUDE.md §3). Run via `just replay` / `just sweep`.
replay = ["analytics/replay"]

[dependencies]
core-types = { path = "../core-types" }
config = { path = "../config" }
timeutil = { path = "../timeutil", features = ["harness"] }
discovery = { path = "../discovery" }
scheduler = { path = "../scheduler" }
feed-util = { path = "../feed-util" }
feed-rtds = { path = "../feed-rtds" }
feed-binance = { path = "../feed-binance" }
feed-clob = { path = "../feed-clob" }
model = { path = "../model" }
venue-api = { path = "../venue-api" }
venue-live = { path = "../venue-live" }
venue-paper = { path = "../venue-paper" }
engine = { path = "../engine" }
journal = { path = "../journal" }
analytics = { path = "../analytics" }
dashboard = { path = "../dashboard" }
anyhow = { workspace = true }
rust_decimal = { workspace = true }
# `bot control` is an HTTP client to the running dashboard's control API.
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# net + time so the current-thread runtime can enable the IO/timer drivers
# reqwest needs; sync (channels) + signal (ctrl-c) + macros (select!) for the
# scheduler smoke loop.
tokio = { workspace = true, features = ["rt", "net", "time", "sync", "signal", "macros"] }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# `test-util` adds tokio's paused-clock (`start_paused`) for the venue-parity
# golden tests; the other features mirror the lib's so the test target builds.
tokio = { workspace = true, features = ["rt", "time", "sync", "macros", "test-util"] }
