[package]
name = "venue-paper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Paper matching engine, ledger, and fee/rebate simulation"

[lints]
workspace = true

[dependencies]
venue-api = { path = "../venue-api" }
# All market data (Event, BookSnapshot, LastTrade, MarketInfo) and the shared
# `taker_fee` live in core-types, not feed-clob (whose BookState is private) —
# so the §4 "feed-clob types" dep is replaced by core-types for a leaner
# rebuild (see the Decisions Log entry for this task).
core-types = { path = "../core-types" }
# The async driver: the order/fill event channel, the Notify wake, and the
# latency timer task. The sans-IO MatchEngine itself uses no tokio.
tokio = { workspace = true, features = ["sync", "rt", "time", "macros"] }
thiserror = { workspace = true }
tracing = { workspace = true }
rust_decimal = { workspace = true }

[dev-dependencies]
# Paused virtual time for the one async-driver integration test.
tokio = { workspace = true, features = ["sync", "rt", "time", "macros", "test-util"] }
