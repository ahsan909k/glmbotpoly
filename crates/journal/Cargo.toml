[package]
name = "journal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Append-only event log and replay reader"

[lints]
workspace = true

[dependencies]
core-types = { path = "../core-types" }
# The serde projection of the bus `Event` (which is deliberately not serde) and
# the JSONL segment encoding. All §3-allowlisted.
serde = { workspace = true }
serde_json = { workspace = true }
# Bounded channel between the bus consumer and the off-path writer thread.
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
thiserror = { workspace = true }
# Segment-filename timestamp (`YYYYMMDD-HHMMSS`).
time = { workspace = true }
# gzip the rotated segments (operator-mandated; pure-Rust backend) — see the
# workspace allowlist note and Decisions Log 2026-06-14.
flate2 = { workspace = true }
# The queryable structured sqlite index over the low-rate events (orders, fills,
# windows, settlements, breaker trips, config changes) — see the workspace
# allowlist note and Decisions Log 2026-06-15. The connection lives entirely on
# the writer thread; reads open a separate read-only connection.
rusqlite = { workspace = true }
# Lossless decimal ↔ TEXT conversion at the sqlite column boundary (and `dec!`
# in tests). The serde/Display string form round-trips every digit and scale.
rust_decimal = { workspace = true }
